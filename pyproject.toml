[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openinverter-can-tool"
version = "0.5.1"
description = "Tool to configure and operate OpenInverter systems over CAN"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT License"}
authors = [
    {name = "David J. Fiddes", email = "D.J@fiddes.net"}
]
keywords = ["openinverter", "canopen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "click",
    "canopen>=2.4.1",
    "appdirs",
    "python-can[serial]",
    "cantools",
    "pyside6",
]

[project.optional-dependencies]
dev = [
    "check-manifest",
    "flake8",
    "pre-commit",
]
test = [
    "coverage",
    "pytest",
    "approvaltests",
    "pytest-approvaltests",
    "pytest-cov",
]

[project.scripts]
oic = "openinverter_can_tool.__main__:cli"

[project.gui-scripts]
oic-gui = "openinverter_can_tool.gui:main"
oic-gui2 = "openinverter_can_tool.gui2.app:main"

[project.urls]
"Bug Reports" = "https://github.com/davefiddes/openinverter-can-tool/issues"
"Source" = "https://github.com/davefiddes/openinverter-can-tool"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
